[project]
name = "xwam"
version = "0.1.0"
description = "Unified 4D World Action Modeling from Video Priors with Asynchronous Denoising"
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchaudio",
    "numpy>=1.23.5,<1.26",
    "opencv-python>=4.9.0.80",
    "scipy>=1.13.1",
    "diffusers>=0.31.0",
    "transformers>=4.49.0,<=4.51.3",
    "tokenizers>=0.20.3",
    "accelerate>=1.1.1",
    "tqdm",
    "decord",
    "imageio[ffmpeg]",
    "easydict",
    "ftfy",
    "dashscope",
    "imageio-ffmpeg",
    "h5py",
    "tyro",
    "omegaconf",
    "einops",
    "lightning",
    "deepspeed>=0.16.0",
]

[project.optional-dependencies]
flash-attn = ["flash-attn==2.8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "modules",
    "runners",
    "utils",
]

[tool.uv]
# index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# flash-attn builds against the already-installed torch, so build isolation must be off
no-build-isolation-package = ["flash-attn"]

# PyTorch CUDA 12.9 wheels
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129" },
]
torchvision = [
    { index = "pytorch-cu129" },
]
